<section id="welcome" aria-labelledby="welcome-heading">
  <h2 id="welcome-heading" tabindex="-1">Welcome</h2>

  <p>
    I’m putting this guide together because I genuinely love collecting Pokémon as a hobby.
    Like a lot of people, I dug out my old collection one day and realized I had no idea
    what anything was worth anymore. The sets had changed, the market had changed, and I
    felt completely lost trying to figure out where to even start.
  </p>

  <p>
    If you’re here, you might be in a similar spot: maybe you just found a childhood
    binder, bought a collection, or started ripping packs again and now you’re wondering
    what you actually have. It can be overwhelming to sort through piles of cards,
    strange set symbols, and a million different price websites.
  </p>

  <p>
    My goal with this guide is to make that process a lot less confusing. I want to help
    new or returning collectors learn how to:
  </p>

  <ul>
    <li>Identify what card you’re looking at (set, number, rarity, etc.).</li>
    <li>Use price tools confidently to estimate value.</li>
    <li>Decide when grading makes sense and what companies look for.</li>
    <li>Track your collection so you actually know what you have.</li>
  </ul>

  <p>
    By the time you work through these sections, my hope is that you’ll feel confident
    looking at a card and saying, “I know what this is, I know roughly what it’s worth,
    and I know what to do with it next.”
  </p>
</section>

<section id="identify" aria-labelledby="identify-heading">
  <h2 id="identify-heading" tabindex="-1">How do I identify my card?</h2>

  <div class="indent-level-1">
    <h3 id="identify-card-name" tabindex="-1">Card name</h3>
    <div class="indent-level-2">
  <ul>
    <li>The most obvious identifier is the name, but there are hundreds of "Pikachu" cards, so this likely won't be enough on its own.</li>
    <li>The language is also an important factor. Pokemon cards are printed in many languages including English, Japanese, Chinese, Korean, and more.</li>
  </ul>
</div>

    <h3 id="identify-card-number" tabindex="-1">Card number</h3>
    <div class="indent-level-2">
  <ul>
    <li>Located at the bottom of the card, this identifies which card it is within the given set. e.g. 175/203.</li>
    <li>The first number is the card number that identifies that card. The second number is the number of cards in the <strong>base set</strong> list. There are multiple cards in a set that come after the <strong>base set</strong> list, so you will likely come across something like 203/193.</li>
  </ul>
</div>

    <h3 id="identify-set-symbol" tabindex="-1">Set symbol</h3>
    <div class="indent-level-2">
  <ul>
    <li>Every era up to and including Sword and Shield have symbols that represent the specific set the card is from. For Wizards of the Coast (WOTC) sets, the symbol is located at the bottom right of the <strong>portrait</strong>. Post WOTC, the set symbol was moved to the bottom of the card.</li>
    <li>Scarlet and Violet and Mega Evolution eras use a three letter abbreviation that represents the set it's from. They are located in the bottom left corner of the cards.</li>
    <li>Each era also has "Black Star Promo" cards that are marked by a black star with the word "promo" in it in the bottom left corner next to the card number.</li>
    <li>
      <a href="" data-link-key="external_bulbapedia_expansions" target="_blank" rel="noopener noreferrer">This</a>
      is an excellent reference page when searching by symbol or abbreviation.
    </li>
  </ul>
</div>

    <h3 id="identify-rarity" tabindex="-1">Rarity</h3>
    <div class="indent-level-2">
  <ul>
    <li>
      The rarity of a card can be found by a symbol or shape at the bottom of the card. A few common rarities include:
      <ul>
        <li><strong>Circle</strong> - Common</li>
        <li><strong>Diamond</strong> - Uncommon</li>
        <li><strong>Black Star</strong> - Rare (no "Promo" text)</li>
        <li><strong>Two Black Stars</strong> - Double Rare</li>
        <li><strong>Two White Stars</strong> - Ultra Rare</li>
        <li><strong>Gold Star</strong> - Illustration Rare (IR)</li>
        <li><strong>Two Gold Stars</strong> - Special Illustration Rare (SIR)</li>
      </ul>
    </li>
    <li>
      These are two excellent reference guides on rarity symbols:
      <ul>
        <li>
          <a href="" data-link-key="external_tcgplayer_rarity_article"
            target="_blank" rel="noopener noreferrer">TCGPlayer Rarity Symbol Guide</a>
        </li>
        <li>
          <a href="" data-link-key="external_cgc_rarity_symbols" target="_blank"
            rel="noopener noreferrer">CGC Rarity Symbol Guide</a>
        </li>
      </ul>
    </li>
  </ul>
</div>

    <h3 id="identify-vintage" tabindex="-1">Vintage print runs</h3>
    <div class="indent-level-2">
  <p>
    Early print runs of classic sets can come in several flavors. Knowing whether a card is 1st edition, shadowless, or unlimited helps you identify scarcity and value.
  </p>

  <h4 id="identify-vintage-first-edition" tabindex="-1">1st edition</h4>
  <div class="indent-level-3">
  <p>
    First edition cards are identified by an "Edition 1" stamp located in the left-center of the card, just below the
    bottom left corner of the portrait:
  </p>

  <img src="images/cards/base_set/1st_edition/1st_edition_charizard.png"
    alt="Close-up of the black Edition 1 stamp on a Base Set Pokémon card" loading="lazy"
    decoding="async" width="351" height="481" class="content-image">

  <ul>
    <li>All 1st edition cards are <a href="" data-link-key="internal_identify_vintage_shadowless">shadowless</a>, with the exception of a specific Machamp that was only available as
      part of the two-player starter deck.</li>
    <li>Most relevant to early Wizards of the Coast (WOTC) sets; later sets generally stopped using 1st edition stamps.
    </li>
  </ul>
</div>

  <h4 id="identify-vintage-shadowless" tabindex="-1">Shadowless</h4>
  <div class="indent-level-3">
  <p>
    Early unlimited print run of Base Set (after 1st edition) with no drop shadow on the right and bottom edges of the art box. Print details and colors also differ slightly (lighter yellow borders, thinner HP font).
  </p>
  <ul>
    <li>No shadow next to the art box; later unlimited cards add a gray shadow.</li>
    <li>Typically more valuable than standard unlimited but below 1st edition.</li>
    <li>Only applies to early Base Set prints; other sets do not have a shadowless variant.</li>
  </ul>
</div>

  <h4 id="identify-vintage-unlimited" tabindex="-1">Unlimited</h4>
  <div class="indent-level-3">
  <p>
    Standard mass-market print run. For Base Set, unlimited cards have the gray shadow around the art box and no 1st edition stamp. These are the most common and generally the most affordable version of vintage prints.
  </p>
  <ul>
    <li>Has the shadow around the portrait box (unlike shadowless).</li>
    <li>No Edition 1 stamp.</li>
    <li>Commonly what you see in bulk collections and most marketplace listings.</li>
  </ul>
</div>

  <h4 id="identify-vintage-identification" tabindex="-1">Quick identification tips</h4>
  <div class="indent-level-3">
  <ul>
    <li><strong>Check the stamp first</strong>: Edition 1 stamp present = 1st edition (unless it's Machamp); absent =
      either shadowless or unlimited.</li>
    <li><strong>Look for the shadow</strong>: No shadow along the right of the art box = shadowless; shadow present =
      unlimited.</li>
    <li><strong>Border/color cues</strong>: Shadowless cards have a lighter yellow border and thinner HP text than
      unlimited.</li>
    <li><strong>Apply only where it matters</strong>: Shadowless exists only for early Base Set prints. Later sets are
      typically just 1st edition vs. unlimited (or only unlimited).</li>
  </ul>
</div>
</div>
  </div>
</section>

<section id="condition" aria-labelledby="condition-heading">
  <h2 id="condition-heading" tabindex="-1">Condition</h2>

  <div class="indent-level-1">
    <p>The condition of a card is an important factor when determining the value of a card. A card in "NM" (Near Mint)
      condition is generally worth far more than one in "Damaged" condition. The list of recognized conditions are as
      follows:
    </p>

    <h3 id="condition-grades" tabindex="-1">Common condition grades</h3>
    <div class="indent-level-2">
  <ul>
    <li><strong>NM</strong> - Near Mint</li>
    <li><strong>LP</strong> - Lightly Played</li>
    <li><strong>MP</strong> - Moderately Played</li>
    <li><strong>HP</strong> - Heavily Played</li>
    <li><strong>Damaged</strong> - Speaks for itself, the card is damaged.</li>
  </ul>
</div>

    <p>
      <a href="" data-link-key="external_tcgplayer_condition_overview" target="_blank"
        rel="noopener noreferrer">This</a> is the standard guide used to determine what each condition means.
    </p>

    <h3 id="condition-how-to-check" tabindex="-1">How to check your card</h3>
    <div class="indent-level-2">
  <h4 id="condition-quick-check" tabindex="-1">Quick self-check</h4>
  <ul>
    <li>Use good lighting and tilt the card to see surface flaws.</li>
    <li>Inspect edges, corners, and front/back surface.</li>
    <li>Optional helpers: sleeve, microfiber cloth, loupe.</li>
  </ul>

  <h4 id="condition-common-issues" tabindex="-1">Common issues</h4>
  <ul>
    <li><strong>Whitening</strong> - Tiny white spots on edges/corners where ink has worn off. Light specks usually put a card in LP; heavy whitening drops it further.</li>
    <li><strong>Scratches</strong> - Surface lines on the front/back (look under angled light). Minor print lines may still fit LP; deep or numerous scratches push it to MP/HP.</li>
    <li><strong>Creases</strong> - Any crease is considered damage and usually drops a card to HP or worse, even if it only shows at an angle. Deep creases with color break can be treated as Damaged regardless of the rest of the card.</li>
    <li><strong>Bends</strong> - A gentle curve/warp by itself doesn't change condition and can often be flattened by sleeving the card and pressing it in a heavy book or binder pages for a few days. Avoid heat/steam. If the bend leaves a visible line or you can feel it, that's a crease and should be graded as HP/Damaged.</li>
    <li><strong>Other defects</strong> - Water damage, tearing, peeling, stains, or writing will also reduce condition.</li>
  </ul>
</div>

  </div>
</section>

<section id="card-care" aria-labelledby="card-care-heading">
  <h2 id="card-care-heading" tabindex="-1">Card care and storage</h2>

  <div class="indent-level-1">
    <p>
      Properly storing your cards will help preserve their condition,
      which is vital to retaining value, collectibility, and longevity.
    </p>

    <h3 id="card-care-sleeves" tabindex="-1">Penny sleeves</h3>
    <div class="indent-level-2">
  <p>
    The most important aspect of card storage for anything of even minor value, is to
    <strong>PUT IT IN A PENNY SLEEVE</strong>.
    You don't need to sleeve your bulk or energy cards (you're totally allowed to if you want though),
    but for any card you even remotely care about preserving the condition of, I say again,
    <strong>PUT IT IN A PENNY SLEEVE</strong>!
  </p>
  <p>
    Penny sleeves are your first line of defense. They help prevent scratches from normal handling and
    shuffling, dust, dirt, oils, etc.
  </p>
  <h4 id="card-care-sleeves-material" tabindex="-1">Material</h4>
  <ul>
    <li>Polypropylene, not PVC material</li>
    <li>Acid-free</li>
    <li>No softeners / plasticizers</li>
  </ul>
  <h4 id="card-care-sleeves-size" tabindex="-1">Size</h4>
  <ul>
    <li>2.5" x 3.5"</li>
    <li>
      0.05 - 0.09mm thickness is fine. Thicker sleeves are considered more "premium" and provide slightly
      better protection. The thinner it gets, the more likely it gives way to potential damage.
    </li>
    <li>
      The card should fit in the penny sleeve snugly enough that it doesn't slide around easily, but loose
      enough that it is relatively easy to slide in and out of the sleeve.
    </li>
  </ul>
  <h4 id="card-care-sleeves-common_brands" tabindex="-1">Common brands</h4>
  <ul>
    <li>
      <a href="" data-link-key="external_ultrapro_sleeves">
        Ultra Pro
      </a>
    </li>
    <li>
      <a href="" data-link-key="external_vaultx_sleeves">
        Vault-X
      </a>
    </li>
    <li>
      There are tons of other options as well so don't think you have to use either of these, but they are
      very popular and trusted brands.
    </li>
  </ul>
</div>

    <h3 id="card-care-toploaders" tabindex="-1">Top Loaders</h3>
    <div class="indent-level-2">
  <p>
    Top loaders are hard plastic sleeves that provide a second layer of protection for the more important cards in
    your collection.
  </p>
  <p>
    The most important thing about top loaders is that you <strong>NEVER put your card in one WITHOUT A PENNY
      SLEEVE.</strong> Penny sleeve first, then insert the card, with it in the penny sleeve, inside the top loader.
  </p>
  <h4 id="card-care-toploaders-material" tabindex="-1">Material</h4>
  <ul>
    <li>Polypropylene / non-PVC is the preferred material</li>
    <li>
      PVC is not ideal, but okay here since the card should <strong>NEVER</strong> be in one without a penny sleeve,
      and the penny sleeve will do a decent job at protecting it.
    </li>
  </ul>
  <h4 id="card-care-toploaders-size" tabindex="-1">Size</h4>
  <ul>
    <li>3" x 4"</li>
    <li>
      35pt top loaders are the standard, preferred size.
      <ul>
        <li>It fits one card (there's space and flexibility to put more than that, but...don't).</li>
      </ul>
    </li>
  </ul>
  <h4 id="card-care-toploaders-common_brands" tabindex="-1">Common brands</h4>
  <ul>
    <li>
      <a href="" data-link-key="external_ultrapro_toploaders">
        Ultra Pro
      </a>
    </li>
    <li>
      <a href="" data-link-key="external_vaultx_toploaders">
        Vault-X
      </a>
    </li>
    <li>
      There are tons of other options as well so don't think you have to use either of these, but they are
      very popular and trusted brands.
    </li>
  </ul>
</div>

    <h3 id="card-care-team-bags" tabindex="-1">Team Bags</h3>
    <div class="indent-level-2">
  <p>
    Team bags are resealable outer sleeves that fit over a toploader or card saver,
    adding a final barrier against dust, moisture, and scuffs during storage or shipping.
  </p>
  <p>
    They are inexpensive, easy to remove, and great for keeping a protected card from
    sliding out of its holder.
  </p>
</div>

    <h3 id="card-care-graded-card-protection" tabindex="-1">Graded Card Protection</h3>
    <div class="indent-level-2">
  <p>
    Once a card is graded, the slab becomes the main layer of protection. At that point,
    the goal is less about protecting the card itself from handling and more about keeping
    the case clean, scratch-free, and safely stored.
  </p>
  <p>
    There's also some options to spice up the look of the slab a bit to make it pop even more! Below we'll review some
    of the options.
  </p>

  <h4 id="card-care-graded-card-protection-slab_sleeves" tabindex="-1">Slab sleeves</h4>
  <ul>
    <li>Use a slab sleeve / slab bag if you want to prevent scratches, dust, and fingerprints on the case.</li>
    <li>A team bag can work in some cases, but a slab-specific sleeve is usually a better fit.</li>
  </ul>

  <h4 id="card-care-graded-card-protection-gradedguards" tabindex="-1"><a href=""
      data-link-key="external_gradedguard" target="_blank" rel="noopener noreferrer">Graded Guard</a></h4>
  <ul>
    <li>
      <a href="" data-link-key="external_gradedguard" target="_blank"
        rel="noopener noreferrer">Graded Guard</a>
      makes silicone bumpers that wrap around the outside edge of a slab to help reduce scuffs and minor impact damage.
      They also have a large variety of colors and designs to fit the art style of the card inside.
    </li>
  </ul>

  <h4 id="card-care-graded-card-protection-carddictive" tabindex="-1"><a href=""
      data-link-key="external_carddictive" target="_blank" rel="noopener noreferrer">Carddictive</a></h4>
  <ul>
    <li>
      <a href="" data-link-key="external_carddictive" target="_blank"
        rel="noopener noreferrer">Carddictive</a>
      makes premium storage products for graded cards, including slab cases and storage options sized for PSA, CGC,
      and BGS slabs. They look absolutely fantastic, and provide additional protection to the slab as it fully encloses
      it within a UV protected case. They have various color options as well so you can customize your display exactly
      the way you like it!
    </li>
  </ul>
</div>

    <h3 id="card-care-binders" tabindex="-1">Binders</h3>
    <div class="indent-level-2">
  <h4 id="card-care-binders-material" tabindex="-1">Material</h4>
  <ul>
    <li>Polypropylene</li>
    <li>Acid-free</li>
    <li>PVC-free / non-PVC</li>
  </ul>
  <h4 id="card-care-binders-what_to_look_for" tabindex="-1">What to look for</h4>
  <ul>
    <li>
      Side-loaded
      <ul>
        <li>
          Side-loaded binders are generally the preferred binder to organize/store cards.
        </li>
        <li>
          The side-loaded aspect helps prevent cards from falling out of their
          pockets if the binder is dropped, flipped, or jostled.
        </li>
      </ul>
    </li>
    <li>
      Zipped
      <ul>
        <li>Keeps dust out.</li>
        <li>Prevents cards from falling out of binder if they happen to slip out of their pockets.</li>
      </ul>
    </li>
    <li>Correct <a href="" data-link-key="internal_card_care_binders_material">materials</a></li>
  </ul>
  <h4 id="card-care-binders-alternatives" tabindex="-1">Alternatives</h4>
  <ul>
    <li>
      Top loader
      <ul>
        <li>Top loader binders have large pockets to fit an entire
          <a href="" data-link-key="internal_card_care_toploaders">Top Loader</a>
          in it.
        </li>
        <li>These are generally used for really high-value collections.</li>
        <li>They get very large and very heavy very quickly.</li>
        <li>
          While they have their place, they are not generally the preferred
          binder type for collectors due to their size.
        </li>
      </ul>
    </li>
  </ul>
  <h4 id="card-care-binders-avoid" tabindex="-1">Avoid</h4>
  <ul>
    <li>
      3-ring / D-ring
      <ul>
        <li>
          These can (and likely will) damage cards next to the ring over time. They put pressure on the side of the
          card, causing dents, creases, or even tearing.
        </li>
        <li>
          <strong>Strongly</strong> recommend <strong>NOT</strong> using these types of binders.
        </li>
        <li>
          If you absolutely must use this type, go with D-ring and not 3-ring, as they're less likely
          to cause damage. Make sure all the pages sit properly when closing/storing the binder to
          help reduce the risk of damage to your cards.
        </li>
      </ul>
    </li>
  </ul>
  <h4 id="card-care-binders-Summary" tabindex="-1">Summary</h4>
  <ul>
    <li>Use side-loading, PVC-free pages; avoid front-loaders that can dump cards if flipped.</li>
    <li>Zip binders keep dust out; don’t overfill pages so pockets stay flat.</li>
    <li>Pick a binder with pages that are sewn or welded into the spine so no metal rings can dent the cards.</li>
  </ul>
</div>

    <h3 id="card-care-environment" tabindex="-1">Environment</h3>
    <div class="indent-level-2">
  <ul>
    <li>Store cool, dry, and dark: target ~40-60% humidity and stable room temperature.</li>
    <li>Avoid direct sunlight and UV exposure.</li>
    <li>Keep cards off the floor to avoid dust, dirt, and moisture.</li>
    <li>Add silica gel packs to boxes/binders in humid areas; replace them periodically.</li>
  </ul>
</div>

    <h3 id="card-care-checklist" tabindex="-1">Quick checklist</h3>
    <div class="indent-level-2">
  <ul>
    <li>Sleeve valuable cards immediately; add top loaders for shipping or higher-end items.</li>
    <li>Keep binders zipped and pages flat; don’t overstuff pockets.</li>
    <li>Store in a cool, dry, dark place away from sunlight and floor moisture.</li>
    <li>Handle by edges with clean hands; keep drinks and food away from your workspace.</li>
  </ul>
</div>

  </div>
</section>

<section id="worth" aria-labelledby="worth-heading">
  <h2 id="worth-heading" tabindex="-1">What's my card worth?</h2>
  <p>
    Card values depend on <strong>which card</strong> it is, <strong>condition</strong>, and <strong>market demand</strong>.
  </p>

  <h3 id="worth-lookup" tabindex="-1">Where to look up value</h3>
  <div class="indent-level-2">
  <h4 id="worth-lookup-tcgplayer" tabindex="-1">TCGPlayer</h4>
  <div class="indent-level-3">
    <p>
      TCGPlayer is considered the gold standard for market value of raw (ungraded) cards. It allows you to search by card name, card number, rarity, set, condition, or any other identifying aspect of your card. There's a ton of filters to narrow your search to help find the exact card you're looking for or just to browse.
    </p>
    <p>Example: "Pikachu+#025"</p>
    <p>
      <strong>Note</strong>: Once you find your card, it's important to look at the <strong>Market Price</strong> of the card and not what it shows the listings start at.
    </p>
  </div>

  <h4 id="worth-lookup-ebay" tabindex="-1">eBay</h4>
  <div class="indent-level-3">
    <p>
      On eBay, always filter to <strong>Sold items</strong>. Use search terms like <code>pokemon [name] [set] [number]</code> and add "PSA 10" or "raw" if needed.
    </p>
    <p>Example: "Pikachu 25/165"</p>
  </div>

  <h4 id="worth-lookup-pricecharting" tabindex="-1">PriceCharting</h4>
  <div class="indent-level-3">
    <p>
      PriceCharting tracks average sale prices over time. It's great for a quick ballpark number, but still cross-check with recent sales on eBay or TCGPlayer for accuracy.
    </p>
  </div>

  <h4 id="worth-lookup-collectr" tabindex="-1">Collectr</h4>
  <div class="indent-level-3">
    <p>
      Collectr is a collection tracking app that we'll cover later, but is another great source for looking up quick ballpark values, however much like PriceCharting you should still check recent sales on eBay and/or TCGPlayer before selling or buying.
    </p>
  </div>
</div>
</section>

<section id="tracking" aria-labelledby="tracking-heading">
  <h2 id="tracking-heading" tabindex="-1">Tracking your Collection</h2>
  <div class="indent-level-1">
    <p>
      Tracking your collection helps you avoid duplicate purchases, estimate total value, and plan trades or sales.
    </p>

    <h3 id="tracking-apps-collectr" tabindex="-1">
      <a href="" data-link-key="external_collectr" target="_blank" rel="noopener noreferrer">
        Collectr
      </a>
    </h3>
    <div class="indent-level-2">
  <ul>
    <li><strong>Platforms</strong>
      <ul>
        <li>Web</li>
        <li>Android</li>
        <li>iOS</li>
      </ul>
    </li>
    <li>
      <strong>Features:</strong>

<section id="grading" aria-labelledby="grading-heading">
  <h2 id="grading-heading" tabindex="-1">Grading</h2>
  <div class="indent-level-1">
    <p>
      Grading is when you send a card to a company to be evaluated, numbered, and sealed in a plastic case (referred to as a "slab").
    </p>
    <p>
      The sections below explain why people grade cards, when it makes sense, what companies look for, and some of the major grading companies you'll hear about.
    </p>

    <h3 id="grading-overview" tabindex="-1">Why people grade cards</h3>
    <div class="indent-level-2">
  <p>
    People grade cards to:
  </p>
  <ul>
    <li>Protect high-value or sentimental cards</li>
    <li>Get a professional opinion on condition</li>
    <li>Make buying/selling easier with a recognized grade</li>
  </ul>
  <p>
    Grading costs time and money, so it's important to be selective about what you send.
  </p>
</div>

    <h3 id="grading-should" tabindex="-1">Should I grade?</h3>
    <div class="indent-level-2">
  <p>
    Not every card is worth grading. Think about both <strong>value</strong> and
    <strong>personal attachment</strong>.
  </p>

  <h4 id="grading-should-companies-look-for" tabindex="-1">What companies look for</h4>
  <ul>
    <li>Centering (borders on all sides)</li>
    <li>Corners (whitening, bends, dings)</li>
    <li>Edges (chipping and nicks)</li>
    <li>Surface (scratches, print lines, dents, stains)</li>
  </ul>

  <h4 id="grading-should-assess-home" tabindex="-1">How to assess at home</h4>
  <ul>
    <li>Use strong lighting and tilt the card to see scratches and print lines.</li>
    <li>Check the back for whitening and edge wear. You can use a black light to really make whitening stand out.</li>
    <li>Compare your card to photos of graded copies online to get a rough idea of where it stands.</li>
  </ul>
</div>

    <h3 id="grading-companies" tabindex="-1">Grading companies</h3>
    <div class="indent-level-2">
  <h4 id="grading-companies-psa" tabindex="-1">PSA</h4>
<div class="indent-level-3">
  <h5>Summary</h5>
  <p>
    Professional Sports Authenticator (PSA) was founded in 1991 and is the biggest third-party card grading company in the hobby today. It started with sports cards but quickly became the default choice for Pokemon and other TCGs, and PSA slabs usually make up the majority of graded sales data. In practice, PSA prices tend to set the "language" of the market - a PSA 10 is often treated as the reference point for what a card can be worth, and many people refer to PSA as the hobby's "gold standard."
  </p>

  <h5>Grading Standards</h5>
  <p>
    PSA uses a 1-10 scale with whole-number grades (plus a few half-grades like 1.5 or 8.5). PSA 10 "Gem Mint" is a virtually perfect card with tight centering tolerances and no obvious flaws. They're generally a little more forgiving than CGC or BGS, but still hold a high standard for a 10.
  </p>
  <p>
    See <a href="" data-link-key="external_psa_standards" target="_blank" rel="noopener noreferrer">PSA Standards</a>
  </p>

  <h5>Value after grading</h5>
  <p>
    For most Pokemon cards, PSA 10s usually sell for more than the same card in a CGC 10 or BGS 9.5, simply because more buyers are hunting PSA slabs and that's what many people search for first. If your main goal is resale value or liquidity, PSA is usually the safest choice. Downsides: fees can be higher at times, turnaround can slow when they're busy, and you don't get subgrades or ultra-detailed label info (unless you pay a lot extra, which seems to be PSA's motto).
  </p>

  <h5>Cost to Grade</h5>
  <p>
    For a typical low-to-mid value Pokemon card, PSA's cheaper "value" tiers usually land around the low- to mid-$20s per card in grading fees, with higher tiers costing more. Once you add round-trip shipping and insurance, grading <em>one</em> card by itself often ends up somewhere in the ballpark of $45-$60 all-in. If it's a particularly high-value card, expect it to cost significantly more, as they will upcharge if you submit in the wrong tier and if the resulting grade increases the value to another tier. Note that they will not downgrade tiers if they give it a lower grade that actually devalues the card. Submitting multiple cards or using a group submitter can bring the per-card cost down quite a bit.
  </p>
  <p>
    For the most up-to-date fees and service levels, see <a href="" data-link-key="external_psa_submission_pricing" target="_blank" rel="noopener noreferrer">PSA's official submission pricing page</a>.
  </p>
</div>
  <h4 id="grading-companies-bgs" tabindex="-1">BGS</h4>
<div class="indent-level-3">
  <h5>Summary</h5>
  <p>
    Beckett Grading Services (BGS) launched in 1999 as the grading arm of Beckett, the company behind the classic price guides. It's one of the longest-running PSA competitors and is especially popular with high-end collectors who like detailed grading information on the label.
  </p>

  <h5>Grading Standards</h5>
  <p>
    BGS uses a 1-10 scale with half-point steps and four subgrades on the label: centering, corners, edges and surface. A 9.5 is their standard "Gem Mint" grade, a 10 is "Pristine," and a <em>Black Label</em> 10 means all four subgrades are 10s. Black Labels are extremely rare and BGS is much stricter than PSA at the very top of the grading scale.
  </p>
  <p>
    See <a href="" data-link-key="external_beckett_standards" target="_blank" rel="noopener noreferrer">BGS Standards</a>
  </p>

  <h5>Value after grading</h5>
  <p>
    In general, PSA 10s tend to outsell BGS 9.5s. However, BGS Pristine 10s commonly sell for more than a PSA 10 because of how hard they are to get. A BGS 10 is usually tougher to achieve than a PSA 10, which is why it often commands a premium on top-tier cards. If you manage to achieve a <strong>Black Label</strong> 10, you've basically won the lottery. Just a quick check on a Japanese Mew 151 sv2a 205/165 - a PSA 10 sold for $390.00, and a BGS Black Label 10 sold for $8,100.00. BGS is a great option if you care about subgrades and chasing ultra-premium grades, but demand is lower than PSA for everyday cards.
  </p>

  <h5>Cost to Grade</h5>
  <p>
    BGS has multiple tiers. Their cheaper options for modern, lower-value cards often fall around the mid-teens to mid-$30s per card depending on whether you want subgrades and how fast you want it back. By the time you add insured shipping both ways, grading a single card commonly ends up closer to roughly $45-$70 all-in, with the higher end being faster tiers or single-card submissions.
  </p>
  <p>
    You can see current options and prices on <a href="" data-link-key="external_beckett_submission_service" target="_blank" rel="noopener noreferrer">Beckett's official card grading service page</a>.
  </p>
</div>
  <h4 id="grading-companies-cgc" tabindex="-1">CGC</h4>
<div class="indent-level-3">
  <h5>Summary</h5>
  <p>
    Certified Guaranty Company (CGC) has been grading comics since 2000, and launched its dedicated CGC Trading Cards division for Pokemon and Magic in 2020. In 2023 it merged its TCG and sports divisions into "CGC Cards," which is now one of the largest card graders in the world. In Pokemon, CGC usually sits right behind PSA alongside BGS in terms of popularity.
  </p>

  <h5>Grading Standards</h5>
  <p>
    CGC uses a 1-10 scale with half-grades. Their current system has a Gem Mint 10 and an even tougher "Pristine 10" tier. CGC built a reputation for being strict, especially on surface scratches and print lines, so a CGC 10 is often viewed as harder to achieve than a PSA 10. Subgrades used to be printed on the label more commonly; even without them, CGC is known for very tight standards. Where CGC really stands out is error and misprint cards: they formally recognize many different kinds of errors and clearly note them on the label, and they don't treat error submissions as an afterthought. Because of that, many collectors consider CGC the king for error cards and misprints.
  </p>
  <p>
    See <a href="" data-link-key="external_cgc_standards" target="_blank" rel="noopener noreferrer">CGC Standards</a>
  </p>

  <h5>Value after grading</h5>
  <p>
    For standard cards, CGC 10s usually sell for a bit less than PSA 10s, which can make them a good value play if you want strong grades without paying the absolute PSA premium. CGC Pristine 10's will generally outperform PSA 10s and land somewhere around the same level as BGS 10s.
  </p>

  <h5>Cost to Grade</h5>
  <p>
    CGC's lower tiers for modern cards are usually in the mid-teens to high-teens (USD) per card, with faster or higher-value tiers costing more. If you're sending just one card, it's reasonable to expect something like $30-$45 total once you include round-trip shipping and insurance. Larger submissions spread out the shipping cost and can bring the per-card total closer to the low-$20s.
  </p>
  <p>
    For exact current rates and tier details, check <a href="" data-link-key="external_cgc_submission_form" target="_blank" rel="noopener noreferrer">CGC's official submission form</a>.
  </p>
</div>
  <h4 id="grading-companies-tag" tabindex="-1">TAG</h4>
<div class="indent-level-3">
  <h5>Summary</h5>
  <p>
    TAG (Technical Authentication &amp; Grading) spent about a decade developing an automated, technology-driven grading system before opening to the public in the early 2020s. It's still a relatively small slice of the market compared to PSA/CGC/BGS, but has grown quickly and built a strong reputation among collectors who care about data and consistency.
  </p>

  <h5>Grading Standards</h5>
  <p>
    Every TAG slab shows a familiar 1-10 grade, but behind the scenes they use a 100-1000 "TAG Score" that maps to that grade and lets you see how strong a particular 9 or 10 really is. Cards are scanned with high-resolution imaging and software that measures centering and identifies defects. You also get a digital grading report with precise centering numbers, a breakdown of "dings" (notable defects), and pop/leaderboard info. That process tends to make TAG quite tough on tiny imperfections that humans might otherwise miss.
  </p>
  <p>
    See <a href="" data-link-key="external_tag_standards" target="_blank" rel="noopener noreferrer">TAG Standards</a>
  </p>

  <h5>Value after grading</h5>
  <p>
    Because TAG is newer, resale prices are usually a bit below PSA for the same grade, but often competitive with or slightly above some other alternatives in modern TCGs, especially when buyers care about the detailed reports. Their strengths are fast turnarounds, very transparent grading, and slick, modern-looking slabs with a lot of data behind the grade.
  </p>

  <h5>Cost to Grade</h5>
  <p>
    TAG offers different services, but for most collectors the common grading options live in roughly the $20-$30 per-card range for standard speed, with faster "priority" style tiers costing more. Since many TAG tiers include some built-in insurance coverage, your extra cost is mostly shipping. For a single card, a rough all-in estimate in the US might be around $40-$60 total; sending a stack at once brings the per-card total down.
  </p>
  <p>
    You can see their current tier breakdown on <a href="" data-link-key="external_tag_pricing" target="_blank" rel="noopener noreferrer">TAG's official pricing page</a>.
  </p>
</div>
  <h4 id="grading-companies-ace-uk" tabindex="-1">ACE (UK)</h4>
<div class="indent-level-3">
  <h5>Summary</h5>
  <p>
    ACE Grading is a UK-based grading company that launched in the early 2020s and focuses heavily on the Pokemon market. It's one of the most visible local options in the UK, with crystal-clear slabs and stylish, artwork-focused labels that are popular with collectors who want their cards to look great on display.
  </p>

  <h5>Grading Standards</h5>
  <p>
    ACE uses a familiar numeric grading scale with 1-10 style grades and named tiers such as Mint and Gem Mint, so it lines up conceptually with PSA/BGS/CGC. Community experience generally puts their strictness somewhere in the middle of the pack - solid and consistent, but not quite as punishing at the very top end as CGC's toughest 10s. Their custom "Ace Labels," which extend or complement the card's art on the label, are a major selling point.
  </p>
  <p>
    See <a href="" data-link-key="external_ace_standards" target="_blank" rel="noopener noreferrer">ACE Standards</a>
  </p>

  <h5>Value after grading</h5>
  <p>
    Outside the UK, ACE-graded cards usually sell for less than equivalent PSA, CGC or BGS grades, mostly because the brand is still regional and has a smaller buyer base. Within the UK, ACE has strong visibility on local marketplaces and streams, so it's a nice option if you want attractive slabs for a personal collection and you're not chasing the absolute top resale value. If your priority is worldwide demand and maximum price, PSA (and high-end BGS/CGC) remains the safer play.
  </p>

  <h5>Cost to Grade</h5>
  <p>
    ACE's own grading tiers in the UK typically run somewhere in the low-teens to high-teens (GBP) per card, depending on how fast you want your order back. After adding insured shipping both ways inside the UK, grading a single card might land somewhere around GBP 20-30 all-in. Submitting several cards together spreads the shipping cost and brings that per-card total down.
  </p>
  <p>
    For the latest ACE pricing and turnaround options, see <a href="" data-link-key="external_ace_submission_portal" target="_blank" rel="noopener noreferrer">ACE's official submission portal</a>.
  </p>
</div>
</div>
  </div>
</section>

<section id="shipping" aria-labelledby="shipping-heading">
  <h2 id="shipping-heading" tabindex="-1">Shipping</h2>

  <p>The most important part about shipping a card is protecting
    the card itself. This can be tricky if you need to ship a lot
    of cards at once, and there's some debate on the correct way to
    ship a lot of cards at once. Because of this we'll only
    go over shipping one card at a time, and you can play with
    the best practices for larger shipments. Use your best judgement
    and always remember preserving the card is more important than
    the material required to ship it, as ultimately if the card
    gets damaged in the process you'll be out the materials AND
    the cost of the card.</p>

  <div class="indent-level-1">
    <h3 id="shipping-supplies" tabindex="-1">Supplies</h3>
    <div class="indent-level-2">
  <p>This is a list of supplies you <i>may</i> need when shipping a card:</p>
  <h4 id="shipping-general-supplies-required">Required</h4>
  <ul>
    <li>Penny Sleeve</li>
    <li>Top Loader OR Card Saver</li>
    <li>Painter's Tape and/or Packing Tape (<strong>not scotch tape</strong>)</li>
  </ul>
  <h4 id="shipping-supplies-optional">Optional</h4>
  <ul>
    <li>Team Bag</li>
  </ul>
  <h4 id="shipping-supplies-oneof">One of the following</h4>
  <ul>
    <li>Plain white envelope</li>
    <li>Bubble Mailer + Bubble Wrap</li>
    <li>Box + Bubble Wrap</li>
  </ul>
</div>

    <h3 id="shipping-raw-cards" tabindex="-1">Raw Cards</h3>
    <div class="indent-level-2">
  <ul>
    <li>Card goes in penny sleeve</li>
    <li>Card and penny sleeve go into either top loader (recommended) or a card saver (still a good option)</li>
    <li>Place a small piece of painter's tape over the opening of the top loader
      or card saver to prevent the card from sliding out during shipping.
      <strong>Do not use scotch tape!</strong> It's a nightmare to get off of a top loader
      and will enrage even the calmest of collectors.
    </li>
    <li>If you use a top loader, it's common to pair it with
      a Team Bag instead of the painter's tape. It looks much cleaner and
      more professional, and adds an extra layer to help keep dust and other contaminents out.</li>
    <li>If you really wanted to, you can ship it in a bubble mailer or a box. Just make sure the
      card is secure within the package - you don't want it banging around on the way to its destination.</li>
    <li>If you really wanted to, some companies make little cardboard sleeves for shipping cards in
      that you could use instead of a top loader or card saver.
      They don't cost much, but generally more than a top loader so why bother.</li>
  </ul>
</div>

    <h3 id="shipping-graded-cards" tabindex="-1">Graded Cards</h3>
    <div class="indent-level-2">
  <ul>
    <li>It's generally a good idea to put the slab in a team bag / slab bag to prevent it
      from getting dirty or scratched during shipping. It's not required, but a good practice.
      They're pretty cheap and the extra care is always appreciated from the customer's perspective.</li>
    <li>Wrap the slab in some bubble wrap, tape all around it (packing tape is a good option here)</li>
    <li>Stick it in either a bubble mailer or a box.</li>
    <li>Slap a label on it.</li>
    <li>The glue on some bubble mailers isn't the best or most reliable, so use packing tape
      across the top to ensure it doesn't come open or get tampered with.</li>
    <li>If using a box, packing tape the whole thing shut.</li>
  </ul>
</div>

    <ul>
      <li>
        <strong><a href="" data-link-key="external_tcgplayer_partner" target="_blank"
            rel="noopener noreferrer">TCGPlayer</a></strong>
        <ul>
          <li>
            This is one of the best places to buy raw cards for any TCG. They have an enormous amount of cards
            available, an incredible number of vendors to choose from with ratings and statuses to give you confidence
            in your purchase. They also have a Cart Optimizer when you're buying multiple cards that will try to find
            the best price and lowest costs to save as much money as possible, as buying a single from multiple vendors
            can add up due to individual shipping costs.
          </li>
        </ul>
      </li>
      <li>
        <strong><a href="" data-link-key="external_ebay" target="_blank" rel="noopener noreferrer">eBay</a></strong>
        <ul>
          <li>
            eBay is always a good option as well. It's well-known, has excellent support, and every listing comes with a
            photo so you can see what condition the card is in, or reach out to the seller to request more photos if
            it's unclear. It has 30 day buyer protection, and for high value cards even an Authenticity Guarantee where
            the card is first shipped to a third party company to verify the legitimacy of it before it is sent to you.
          </li>
        </ul>
      </li>

            want to buy a card at, and a seller can choose to fulfill that order. For selling, you can set a price you
            want someone to buy your card at and anyone can come along and buy it, or you can fulfill an existing
            purchase request.
