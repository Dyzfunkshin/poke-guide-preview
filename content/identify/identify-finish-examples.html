<!-- Scan the same card in each finish, crop to the card edges, then resize to 490px wide. -->
<div class="finish-examples">
  <p>These are flatbed scans of two cards, each in two finishes. Foil reflects the scanner's light away, so foil areas
    look darker and duller here; in hand, they shine when you tilt the card.</p>

  <div class="finish-examples__grid">
    <figure class="finish-example">
      <div class="finish-example__photos">
        <div class="finish-example__photo">
          <img src="images/cards/finishes/jolteon-032-normal.jpg"
            alt="Jolteon 032/103, normal printing: bright yellow background and text box" loading="lazy"
            decoding="async" width="490" height="664" class="content-image">
          <span class="finish-example__label">Normal</span>
        </div>
        <div class="finish-example__photo">
          <img src="images/cards/finishes/jolteon-032-reverse-holo.jpg"
            alt="Jolteon 032/103, reverse holo: the background and text box scan dark olive, while the artwork matches the normal printing"
            loading="lazy" decoding="async" width="490" height="674" class="content-image">
          <span class="finish-example__label">Reverse holo</span>
        </div>
      </div>
      <figcaption class="finish-example__caption">
        <strong><a href="" data-link-key="internal_catalog_jolteon">Jolteon 032/103 (Delta Reign)</a>:</strong> the
        artwork is the same on both; the foil covers everything around it.
      </figcaption>
    </figure>

    <figure class="finish-example">
      <div class="finish-example__photos">
        <div class="finish-example__photo">
          <img src="images/cards/finishes/magmortar-021-holofoil.jpg"
            alt="Magmortar 021/103, holofoil: bright orange background and text box, with the foil in the artwork"
            loading="lazy" decoding="async" width="490" height="672" class="content-image">
          <span class="finish-example__label">Holofoil</span>
        </div>
        <div class="finish-example__photo">
          <img src="images/cards/finishes/magmortar-021-reverse-holo.jpg"
            alt="Magmortar 021/103, reverse holo: the background and text box scan dark, while the artwork is printed flat"
            loading="lazy" decoding="async" width="490" height="674" class="content-image">
          <span class="finish-example__label">Reverse holo</span>
        </div>
      </div>
      <figcaption class="finish-example__caption">
        <strong><a href="" data-link-key="internal_catalog_magmortar">Magmortar 021/103 (Delta Reign)</a>:</strong>
        rares can come as a holofoil, with the foil in the artwork, or a reverse holo, with the foil around it.
      </figcaption>
    </figure>
  </div>
